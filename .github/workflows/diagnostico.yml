name: Diagnóstico (comprobar la web)
# Solo lee: entra en la web desde el servidor de Azure y enseña el registro de errores. No publica ni cambia nada.
on:
  push:
    branches: [diagnostico]
jobs:
  comprobar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar la web y leer errores
        env:
          PERFIL: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        run: |
          USUARIO=$(echo "$PERFIL" | grep -o 'userName="[^"]*"' | head -1 | cut -d'"' -f2)
          CLAVE=$(echo "$PERFIL" | grep -o 'userPWD="[^"]*"' | head -1 | cut -d'"' -f2)
          SCM=$(echo "$PERFIL" | grep -o 'publishUrl="[^"]*"' | head -1 | cut -d'"' -f2 | cut -d: -f1)
          echo "::add-mask::$CLAVE"
          curl -s -u "$USUARIO:$CLAVE" -X PUT -H 'If-Match: *' --data-binary @.github/diagnostico/diag2.sh "https://$SCM/api/vfs/data/diag2.sh"
          curl -s --max-time 900 -u "$USUARIO:$CLAVE" -X POST "https://$SCM/api/command" -H 'Content-Type: application/json' \
               -d '{"command":"bash /home/data/diag2.sh","dir":"/home"}' \
            | python3 -c 'import json,sys;d=json.load(sys.stdin);print(d["Output"]);print(d["Error"])'
