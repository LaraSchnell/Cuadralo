<div class="tarjeta kpi">
  <div class="nombre">{{ t.nombre }}<span class="info" title="{{ t.formula }}">i</span></div>
  <div class="valor">{{ t.valor }}</div>
  <div class="comparar">
    {% if t.ppto %}<span class="etiq {{ t.ppto.estado }}" title="frente al presupuesto">{{ t.ppto.flecha }} {{ t.ppto.texto }} ppto</span>
    {% elif t.ppto is None %}<span class="etiq sin">Sin presupuesto</span>{% endif %}
    {% if t.aa %}<span class="etiq {{ t.aa.estado }}" title="frente al mismo periodo del año anterior">{{ t.aa.flecha }} {{ t.aa.texto }} año ant.</span>
    {% else %}<span class="etiq sin">Sin año anterior</span>{% endif %}
  </div>
</div>
