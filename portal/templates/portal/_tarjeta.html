<div class="tarjeta kpi">
  <div class="nombre">{{ t.nombre }}<span class="info" title="{{ t.formula }}">i</span></div>
  <div class="valor">{{ t.valor }}</div>
  <div class="comparar">
    {% if t.ppto %}<span class="{{ t.ppto.estado }}" title="frente al presupuesto">{{ t.ppto.flecha }} {{ t.ppto.texto }} <span class="lbl">ppto</span></span>
    {% elif t.ppto is None %}<span class="sin">Sin presupuesto</span>{% endif %}
    {% if t.aa %}<span class="{{ t.aa.estado }}" title="frente al mismo periodo del año anterior">{{ t.aa.flecha }} {{ t.aa.texto }} <span class="lbl">año ant.</span></span>
    {% else %}<span class="sin">Sin año anterior</span>{% endif %}
  </div>
</div>
